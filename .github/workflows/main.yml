name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Android NDK r21e
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: 🛠️ Ultimate SDK Fix (Kill all ext bugs)
        run: |
          # Qt-কে কনফিউজ করা সব ext ফোল্ডার এবং নতুন আনস্টেবল ভার্সনগুলো ডিলিট
          rm -rf $ANDROID_SDK_ROOT/platforms/android-*ext*
          rm -rf $ANDROID_SDK_ROOT/platforms/android-3[2-9]*
          # একদম ফ্রেশ এবং স্টেবল Android 31 ইন্সটল
          yes | sdkmanager "platforms;android-31"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          target: 'android'

      - name: Build C++ Code and Package APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          qmake RasFocus.pro
          make -j2
          make install INSTALL_ROOT=android-build
          # এখানে নির্দিষ্ট করে android-31 টার্গেট করে দেওয়া হলো
          androiddeployqt --input android-RasFocusApp-deployment-settings.json --output android-build --gradle --android-platform android-31

      - name: 📥 Upload APK for Rasel
        uses: actions/upload-artifact@v4
        with:
          name: RasFocus-App-APK
          path: android-build/build/outputs/apk/debug/*.apk
