name: RasFocus Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java 11
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 8512546

    - name: Install Correct SDK & NDK
      run: |
        sdkmanager "ndk;21.4.7075529" "platforms;android-31" "build-tools;30.0.3"

    - name: Install Qt for Android
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        target: 'android'
        arch: 'android'

    - name: Build APK
      env:
        ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/21.4.7075529
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        JAVA_HOME: /usr/lib/jvm/temurin-11-jdk-amd64
      run: |
        qmake RasFocus.pro
        make -j$(nproc)
        make install INSTALL_ROOT=android-build
        JSON_FILE=$(ls android-*-deployment-settings.json | head -n 1)
        # এখানে রিলিজ মোডে বিল্ড করা হচ্ছে যাতে এরর কম আসে
        androiddeployqt --output android-build --input $JSON_FILE --gradle --android-platform android-31
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RasFocus-Android-APK
        path: android-build/build/outputs/apk/debug/*.apk
